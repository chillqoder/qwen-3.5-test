<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>
    
    <!-- Audio elements for sound effects -->
    <audio id="sound-flap" preload="auto">
        <source src="assets/sounds/flap.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-score" preload="auto">
        <source src="assets/sounds/score.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-hit" preload="auto">
        <source src="assets/sounds/hit.mp3" type="audio/mpeg">
    </audio>
    
    <script src="js/config.js"></script>
    <script src="js/input.js"></script>
    <script src="js/player.js"></script>
    <script src="js/pipes.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
